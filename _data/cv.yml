  image: /assets/img/portrait.jpg
  website: https://zijian-astro.github.io
  summary: >
    I am a PhD student at the Kavli Institute for Astronomy and Astrophysics, Peking University,
    and from September 2026 to September 2027 a visiting student in Prof. Roberto Maiolino's group
    at the University of Cambridge. I study black hole growth in the early Universe, with a focus on
    little red dots: their variability, their place among active galaxies and their host galaxies,
    using JWST imaging, slitless and integral-field spectroscopy.

